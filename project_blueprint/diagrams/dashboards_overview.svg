    <text x="120" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#0d3b4f">Patient</text>
    <text x="120" y="216" text-anchor="middle" font-size="12" fill="#37474f">Dashboard</text>
    <text x="46" y="242" font-size="11.5" fill="#263238">• Profile</text>
    <text x="46" y="262" font-size="11.5" fill="#263238">• Health info</text>
    <text x="46" y="282" font-size="11.5" fill="#263238">• Symptom assessment</text>
    <text x="46" y="302" font-size="11.5" fill="#263238">• AI triage results</text>
    <text x="46" y="322" font-size="11.5" fill="#263238">• Recommended dept.</text>
    <text x="46" y="342" font-size="11.5" fill="#263238">• Book appointment</text>
    <text x="46" y="362" font-size="11.5" fill="#263238">• Upcoming appts</text>
    <text x="46" y="382" font-size="11.5" fill="#263238">• Appointment history</text>
    <text x="46" y="402" font-size="11.5" fill="#263238">• Prescriptions</text>
    <text x="46" y="422" font-size="11.5" fill="#263238">• Medical records</text>
    <text x="46" y="442" font-size="11.5" fill="#263238">• Lab reports</text>
