<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0d3b4f">5 Major Dashboards</text>

  <!-- Core bar -->
  <rect x="380" y="54" width="440" height="46" rx="8" fill="#0d3b4f"/>
  <text x="600" y="83" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">AI-Powered Healthcare Triage &amp; Appointment System</text>

  <!-- connectors -->
  <line x1="600" y1="100" x2="600" y2="118" stroke="#37474f" stroke-width="2"/>
  <line x1="120" y1="118" x2="1080" y2="118" stroke="#37474f" stroke-width="2"/>
  <line x1="120" y1="118" x2="120" y2="140" stroke="#37474f" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="360" y1="118" x2="360" y2="140" stroke="#37474f" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="600" y1="118" x2="600" y2="140" stroke="#37474f" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="840" y1="118" x2="840" y2="140" stroke="#37474f" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="1080" y1="118" x2="1080" y2="140" stroke="#37474f" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Card template function replicated manually -->
  <!-- 1 Patient -->
  <g>
    <rect x="30" y="142" width="180" height="470" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
