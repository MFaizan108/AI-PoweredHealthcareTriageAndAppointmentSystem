    <text x="640" y="282" font-size="11.5" fill="#301b5c">• Book appointment</text>
    <text x="640" y="302" font-size="11.5" fill="#301b5c">• Reschedule</text>
    <text x="640" y="322" font-size="11.5" fill="#301b5c">• Cancel appointment</text>
    <text x="640" y="342" font-size="11.5" fill="#301b5c">• Check availability</text>
    <text x="640" y="362" font-size="11.5" fill="#301b5c">• Manage waiting queue</text>
    <text x="640" y="382" font-size="11.5" fill="#301b5c">• Check-in patient</text>
    <text x="640" y="402" font-size="11.5" fill="#301b5c">• Mark as arrived</text>
    <text x="640" y="422" font-size="11.5" fill="#301b5c">• Generate token</text>
  </g>

  <!-- 5 Lab Staff -->
  <g>
    <rect x="822" y="142" width="180" height="470" rx="10" fill="#b2ebf2" stroke="#00838f" stroke-width="2"/>
    <text x="912" y="172" text-anchor="middle" font-size="30">🧪</text>
    <text x="912" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#0d3b4f">Lab Staff</text>
    <text x="912" y="216" text-anchor="middle" font-size="12" fill="#37474f">Dashboard</text>
    <text x="838" y="242" font-size="11.5" fill="#00424a">• Test requests</text>
    <text x="838" y="262" font-size="11.5" fill="#00424a">• Pending tests</text>
    <text x="838" y="282" font-size="11.5" fill="#00424a">• Sample status</text>
    <text x="838" y="302" font-size="11.5" fill="#00424a">• Upload reports</text>
    <text x="838" y="322" font-size="11.5" fill="#00424a">• Update test results</text>
    <text x="838" y="342" font-size="11.5" fill="#00424a">• Patient lab history</text>
    <text x="838" y="362" font-size="11.5" fill="#00424a">• Auto-notify doctor</text>
