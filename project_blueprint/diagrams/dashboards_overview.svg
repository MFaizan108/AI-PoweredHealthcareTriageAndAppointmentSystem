    <text x="244" y="462" font-size="11.5" fill="#1b3a1e">• Lab test requests</text>
    <text x="244" y="482" font-size="11.5" fill="#1b3a1e">• Follow-up scheduling</text>
    <text x="244" y="502" font-size="11.5" fill="#1b3a1e">• Appointment status</text>
    <text x="244" y="522" font-size="11.5" fill="#1b3a1e">• Patient communication</text>
  </g>

  <!-- 3 Admin -->
