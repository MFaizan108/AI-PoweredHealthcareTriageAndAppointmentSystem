  <!-- 6th column unused placeholder to balance layout: token queue example moved below -->
  <rect x="1020" y="142" width="150" height="470" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1095" y="172" text-anchor="middle" font-size="12" fill="#78909c">Example</text>
  <text x="1030" y="200" font-size="10.5" fill="#455a64">Token  Doctor  Status</text>
  <text x="1030" y="222" font-size="10.5" fill="#455a64">A-101  Ahmed   Waiting</text>
  <text x="1030" y="244" font-size="10.5" fill="#455a64">A-102  Ahmed   In-Consult</text>
