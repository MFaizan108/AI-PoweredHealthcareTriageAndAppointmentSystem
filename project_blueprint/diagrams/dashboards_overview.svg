    <text x="442" y="282" font-size="11.5" fill="#7a3b00">• Departments</text>
    <text x="442" y="302" font-size="11.5" fill="#7a3b00">• Appointments</text>
    <text x="442" y="322" font-size="11.5" fill="#7a3b00">• Active/cancelled</text>
    <text x="442" y="342" font-size="11.5" fill="#7a3b00">• Revenue</text>
    <text x="442" y="362" font-size="11.5" fill="#7a3b00">• Doctor performance</text>
    <text x="442" y="382" font-size="11.5" fill="#7a3b00">• Patient statistics</text>
    <text x="442" y="402" font-size="11.5" fill="#7a3b00">• AI triage statistics</text>
    <text x="442" y="422" font-size="11.5" fill="#7a3b00">• Emergency cases</text>
    <text x="442" y="442" font-size="11.5" fill="#7a3b00">• Reports</text>
    <text x="442" y="462" font-size="11.5" fill="#7a3b00">• User/role management</text>
    <text x="442" y="482" font-size="11.5" fill="#7a3b00">• Audit logs</text>
    <text x="442" y="502" font-size="11.5" fill="#7a3b00">• System settings</text>
    <text x="442" y="522" font-size="11.5" fill="#7a3b00">• Charts (monthly etc.)</text>
  </g>

  <!-- 4 Receptionist -->
  <g>
    <rect x="624" y="142" width="180" height="470" rx="10" fill="#d1c4e9" stroke="#5e35b1" stroke-width="2"/>
    <text x="714" y="172" text-anchor="middle" font-size="30">🧑‍💼</text>
