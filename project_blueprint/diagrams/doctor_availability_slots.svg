<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0d3b4f">Doctor Availability Engine</text>

  <!-- Doctor sets schedule -->
  <rect x="60" y="60" width="360" height="120" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="240" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0d3b4f">Doctor sets working hours</text>
  <text x="80" y="114" font-size="13" fill="#0d3b4f">Monday   09:00 AM – 01:00 PM</text>
  <text x="80" y="138" font-size="13" fill="#0d3b4f">Tuesday  02:00 PM – 06:00 PM</text>
  <text x="80" y="164" font-size="12" fill="#37474f">... rest of week</text>

  <line x1="420" y1="120" x2="470" y2="120" stroke="#37474f" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- Slot generator -->
  <rect x="472" y="60" width="200" height="120" rx="10" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="572" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#7a3b00">Slot Generation</text>
  <text x="572" y="132" text-anchor="middle" font-size="12" fill="#7a3b00">Engine</text>
  <text x="572" y="154" text-anchor="middle" font-size="11" fill="#7a3b00">(e.g. 20-min intervals)</text>

  <line x1="572" y1="180" x2="572" y2="216" stroke="#37474f" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- Generated slots grid -->
  <text x="450" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">Generated Slots</text>

  <g font-size="13">
    <rect x="200" y="256" width="90" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="245" y="281" text-anchor="middle" fill="#1b3a1e">09:00 ✓</text>

    <rect x="300" y="256" width="90" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="345" y="281" text-anchor="middle" fill="#1b3a1e">09:20 ✓</text>

    <rect x="400" y="256" width="90" height="40" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
    <text x="445" y="281" text-anchor="middle" fill="#5f1414">09:40 ✕</text>

    <rect x="500" y="256" width="90" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="545" y="281" text-anchor="middle" fill="#1b3a1e">10:00 ✓</text>

    <rect x="600" y="256" width="90" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="645" y="281" text-anchor="middle" fill="#1b3a1e">10:20 ✓</text>
  </g>

  <text x="450" y="322" text-anchor="middle" font-size="12" fill="#455a64">🟢 = available slot   🔴 = already booked (double-booking prevented)</text>

  <rect x="150" y="352" width="600" height="70" rx="10" fill="#d1c4e9" stroke="#5e35b1" stroke-width="2"/>
  <text x="450" y="380" text-anchor="middle" font-size="13.5" font-weight="700" fill="#301b5c">Patient books an available slot</text>
  <text x="450" y="402" text-anchor="middle" font-size="12" fill="#301b5c">Slot immediately locked to prevent concurrent double-booking</text>
</svg>
